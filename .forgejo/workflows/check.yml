name: check

# Server (fmt, clippy, tests), app (analyze, tests), the shared XP rules, and the container
# build. Runs on work branches and the default branch. Deliberately not on pull_request:
# the repo is public and these jobs run on a self-hosted runner, so code from a fork must
# not execute there.
on:
  push:
    branches: ['feature/**', 'fix/**', 'main']

jobs:
  server:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git -C src init -q
          git -C src fetch -q --depth 1 "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C src checkout -q --detach FETCH_HEAD

      - name: fmt
        run: cd src && cargo fmt --all --check

      - name: clippy
        run: cd src && cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cd src && cargo test --workspace --locked

  app:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git -C src init -q
          git -C src fetch -q --depth 1 "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C src checkout -q --detach FETCH_HEAD

      # analyze and test do not need google-services.json; only a Gradle build does.
      - name: flutter toolchain
        run: |
          set -euo pipefail
          cd src
          source scripts/android-env.sh
          command -v flutter >/dev/null || { echo "flutter not found on this runner (expected under ~/.local/flutter, see scripts/android-env.sh)"; exit 1; }
          flutter --version
          cd app && flutter pub get

      - name: analyze
        run: |
          set -euo pipefail
          cd src && source scripts/android-env.sh
          cd app && flutter analyze

      - name: test
        run: |
          set -euo pipefail
          cd src && source scripts/android-env.sh
          cd app && flutter test

      - name: restore runbook argv contract
        run: |
          set -euo pipefail
          cd src
          python3 scripts/check_restore_runbook.py packaging/Containerfile packaging/DEPLOY.md scripts/rehearse_restore.sh
          python3 scripts/test_check_restore_runbook.py

  # server/src/xp.rs and app/lib/rules.dart must agree on spec/xp_vectors.json. Both full
  # test runs above already read it; this job runs just those two tests side by side and
  # refuses an empty or malformed vector file, so a drift is named in the job list.
  xp-vectors:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git -C src init -q
          git -C src fetch -q --depth 1 "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C src checkout -q --detach FETCH_HEAD

      - name: vector file is a non-empty list
        run: |
          set -euo pipefail
          cd src
          python3 scripts/check_xp_vectors.py spec/xp_vectors.json

      - name: server rules
        run: |
          cd src
          cargo test --locked -p bread-tracker-server --lib -- xp::tests

      - name: app rules
        run: |
          set -euo pipefail
          cd src && source scripts/android-env.sh
          cd app && flutter pub get >/dev/null && flutter test test/rules_test.dart

  container:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git -C src init -q
          git -C src fetch -q --depth 1 "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C src checkout -q --detach FETCH_HEAD

      # Build only; nothing is pushed or deployed.
      - name: build image
        run: |
          set -euo pipefail
          cd src
          docker build -f packaging/Containerfile -t "bread-tracker:ci-${GITHUB_SHA}" .
          docker image rm "bread-tracker:ci-${GITHUB_SHA}"

      - name: restore runbook argv contract
        run: |
          set -euo pipefail
          cd src
          python3 scripts/check_restore_runbook.py packaging/Containerfile packaging/DEPLOY.md scripts/rehearse_restore.sh
          python3 scripts/test_check_restore_runbook.py
